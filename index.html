<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex">
  <title>モニター写真撮影</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #f3f5f7;
      color: #1c2733;
      font-size: 18px;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 20px 20px 60px; }
    h1 { font-size: 24px; margin: 8px 0 24px; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    p { line-height: 1.7; margin: 0 0 14px; }
    label.title { display: block; font-weight: 600; margin: 0 0 10px; }
    input[type="text"] {
      width: 100%;
      font-size: 28px;
      padding: 14px 16px;
      border: 2px solid #c5ced8;
      border-radius: 12px;
      letter-spacing: 2px;
    }
    input:focus { outline: none; border-color: #1a73e8; }
    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-primary:active { background: #1558b0; }
    .btn-sub { background: #e4e9ee; color: #1c2733; font-size: 18px; padding: 14px; }
    .btn-shoot { background: #0b8043; color: #fff; font-size: 26px; padding: 22px; }
    .btn-shoot:active { background: #086034; }
    .btn-shoot:disabled { background: #9db8a8; }
    .error { color: #c5221f; margin: 10px 0; min-height: 1.4em; font-weight: 600; }
    .small { color: #50606f; font-size: 14px; }

    .id-box {
      display: flex;
      align-items: baseline;
      gap: 12px;
      background: #e8f0fe;
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 14px;
    }
    .id-box small { color: #50606f; font-size: 14px; white-space: nowrap; }
    .id-box strong { font-size: 30px; letter-spacing: 2px; word-break: break-all; }

    /* カメラ映像と人型の枠 */
    .stage-outer { display: flex; justify-content: center; margin-bottom: 14px; }
    .stage {
      position: relative;
      width: 100%;
      height: 300px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stage svg.guide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: translateY(var(--gy, 0%)) scale(var(--gs, 1));
      transform-origin: 50% 50%;
    }
    .adjust { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
    .adjust-title { font-size: 15px; color: #50606f; font-weight: 600; margin-right: 4px; }
    .adjust button {
      flex: 1;
      min-width: 86px;
      border: 2px solid #c5ced8;
      background: #fff;
      border-radius: 10px;
      padding: 10px 4px;
      font-size: 16px;
      font-weight: 600;
      color: #1c2733;
    }
    .adjust button:active { background: #e4e9ee; }
    .guide .under { fill: none; stroke: rgba(0,0,0,.55); stroke-width: 7; stroke-linejoin: round; }
    .guide .over  { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 10 7; stroke-linejoin: round; }
    .stage .msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 17px;
      line-height: 1.6;
    }
    .stage .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .stage .flash.on { opacity: .85; transition: none; }
    .stage .toast {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(11,128,67,.92);
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 14px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    .stage .toast.on { opacity: 1; transition: none; }

    /* 撮影終了後の完了画面 */
    .done-mark { font-size: 64px; text-align: center; line-height: 1; margin: 8px 0 12px; }
    .done-title { font-size: 24px; font-weight: 700; text-align: center; margin: 0 0 18px; color: #0b8043; }
    .done-title.warn { color: #c5221f; }
    .done-info { background: #f3f5f7; border-radius: 12px; padding: 14px 18px; margin-bottom: 18px; line-height: 1.9; }
    .done-info strong { font-size: 22px; }
    .done-warn { color: #c5221f; font-weight: 600; line-height: 1.6; margin: 0 0 18px; }

    /* Before / After の選択 */
    .phases { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 4px; }
    .phases button {
      border: 2px solid #c5ced8;
      background: #fff;
      border-radius: 14px;
      padding: 20px 4px;
      font-size: 24px;
      font-weight: 700;
      color: #1c2733;
    }
    .phases button.on { border-color: #1a73e8; background: #e8f0fe; color: #1a73e8; }
    .badge {
      display: inline-block;
      background: #1a73e8;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      margin-left: auto;
      white-space: nowrap;
    }

    .labels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
    .labels button {
      border: 2px solid #c5ced8;
      background: #fff;
      border-radius: 12px;
      padding: 14px 2px;
      font-size: 18px;
      font-weight: 600;
      color: #1c2733;
    }
    .labels button.on { border-color: #0b8043; background: #e6f4ea; color: #0b8043; }
    #fileInput { display: none; }
    #fallbackBtn { margin-top: 10px; }

    .list { list-style: none; padding: 0; margin: 0; }
    .list li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #e4e9ee;
    }
    .list li:last-child { border-bottom: none; }
    .list img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #ddd; }
    .list .info { flex: 1; min-width: 0; }
    .list .name { font-size: 15px; word-break: break-all; }
    .list .st { font-size: 15px; font-weight: 700; }
    .st.sending { color: #b06000; }
    .st.done { color: #0b8043; }
    .st.fail { color: #c5221f; }
    .empty { color: #7a8794; font-size: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- 画面：入口アプリと接続中 -->
  <div id="screenWait">
    <h1>モニター写真撮影</h1>
    <div class="card"><p>入口アプリと接続しています…</p></div>
  </div>

  <!-- 画面：入口アプリとつながらなかった -->
  <div id="screenNoBridge" class="hidden">
    <h1>モニター写真撮影</h1>
    <div class="card">
      <p><strong>入口アプリとつながっていません。</strong></p>
      <p>このページは、入口アプリ（GASのURL）の「撮影画面を開く」ボタンから開いてください。<br>
         このタブを閉じて、入口アプリから開き直してください。</p>
      <p class="small" id="bridgeDetail"></p>
    </div>
  </div>

  <!-- 画面1：顧客ID入力 -->
  <div id="screenId" class="hidden">
    <h1>モニター写真撮影</h1>
    <div class="card">
      <label class="title" for="customerId">顧客ID</label>
      <input type="text" id="customerId" inputmode="numeric" autocomplete="off"
             autocapitalize="off" autocorrect="off" placeholder="例：12345">

      <label class="title" style="margin-top:20px">撮影区分</label>
      <div class="phases" id="phases">
        <button type="button" data-phase="Before">Before</button>
        <button type="button" data-phase="After">After</button>
      </div>

      <div class="error" id="idError"></div>
      <button class="btn btn-primary" id="startBtn">撮影を始める</button>
    </div>
  </div>

  <!-- 画面2：撮影 -->
  <div id="screenShoot" class="hidden">
    <div class="card">
      <div class="id-box">
        <small>撮影中の顧客ID</small>
        <strong id="idDisplay"></strong>
        <span class="badge" id="phaseBadge"></span>
      </div>

      <div class="stage-outer">
        <div class="stage" id="stage">
          <video id="video" playsinline autoplay muted></video>

          <!-- 人型の枠（写真には写りません） -->
          <!-- 正面・後ろ用：腕を斜め下に開き、足を肩幅に開いた姿勢 -->
          <svg class="guide" id="guideFront" viewBox="30 0 240 400" preserveAspectRatio="xMidYMid meet">
            <g class="under">
              <ellipse cx="150" cy="111" rx="16" ry="19"/>
              <path d="M142 132 L158 132 C164 141 174 144 184 149 L228 246 L224 256 L210 254 L170 176 L174 206 L186 244 L189 300 L188 360 L196 372 L166 372 L170 360 L163 300 L150 268 L137 300 L130 360 L134 372 L104 372 L112 360 L111 300 L114 244 L126 206 L130 176 L90 254 L76 256 L72 246 L116 149 C126 144 136 141 142 132 Z"/>
            </g>
            <g class="over">
              <ellipse cx="150" cy="111" rx="16" ry="19"/>
              <path d="M142 132 L158 132 C164 141 174 144 184 149 L228 246 L224 256 L210 254 L170 176 L174 206 L186 244 L189 300 L188 360 L196 372 L166 372 L170 360 L163 300 L150 268 L137 300 L130 360 L134 372 L104 372 L112 360 L111 300 L114 244 L126 206 L130 176 L90 254 L76 256 L72 246 L116 149 C126 144 136 141 142 132 Z"/>
            </g>
          </svg>

          <!-- 左向き用：画面の左を向き、両腕を前に伸ばした姿勢 -->
          <svg class="guide hidden" id="guideLeft" viewBox="30 0 240 400" preserveAspectRatio="xMidYMid meet">
            <g class="under">
              <ellipse cx="146" cy="111" rx="17" ry="19"/>
              <path d="M140 132 L158 132 C164 138 168 144 168 152 L168 205 L173 245 L168 290 L167 335 L166 372 L124 372 L126 364 L146 356 L146 300 L140 250 L136 215 L135 180 L136 170 L82 170 L76 160 L82 150 L140 146 Z"/>
            </g>
            <g class="over">
              <ellipse cx="146" cy="111" rx="17" ry="19"/>
              <path d="M140 132 L158 132 C164 138 168 144 168 152 L168 205 L173 245 L168 290 L167 335 L166 372 L124 372 L126 364 L146 356 L146 300 L140 250 L136 215 L135 180 L136 170 L82 170 L76 160 L82 150 L140 146 Z"/>
            </g>
          </svg>

          <!-- 右向き用：左向きを左右反転したもの -->
          <svg class="guide hidden" id="guideRight" viewBox="30 0 240 400" preserveAspectRatio="xMidYMid meet">
            <g transform="translate(300,0) scale(-1,1)">
              <g class="under">
                <ellipse cx="146" cy="111" rx="17" ry="19"/>
                <path d="M140 132 L158 132 C164 138 168 144 168 152 L168 205 L173 245 L168 290 L167 335 L166 372 L124 372 L126 364 L146 356 L146 300 L140 250 L136 215 L135 180 L136 170 L82 170 L76 160 L82 150 L140 146 Z"/>
              </g>
              <g class="over">
                <ellipse cx="146" cy="111" rx="17" ry="19"/>
                <path d="M140 132 L158 132 C164 138 168 144 168 152 L168 205 L173 245 L168 290 L167 335 L166 372 L124 372 L126 364 L146 356 L146 300 L140 250 L136 215 L135 180 L136 170 L82 170 L76 160 L82 150 L140 146 Z"/>
              </g>
            </g>
          </svg>

          <div class="msg" id="camMsg">カメラを起動しています…</div>
          <div class="flash" id="flash"></div>
          <div class="toast" id="toast">✓ 撮影しました</div>
        </div>
      </div>

      <div class="adjust" id="adjust">
        <span class="adjust-title">枠の調整</span>
        <button type="button" data-adj="smaller">小さく</button>
        <button type="button" data-adj="bigger">大きく</button>
        <button type="button" data-adj="up">↑ 上へ</button>
        <button type="button" data-adj="down">↓ 下へ</button>
        <button type="button" data-adj="reset">元に戻す</button>
      </div>

      <label class="title">撮影する向き</label>
      <div class="labels" id="labels">
        <button type="button" data-label="正面" class="on">正面</button>
        <button type="button" data-label="左向き">左向き</button>
        <button type="button" data-label="右向き">右向き</button>
        <button type="button" data-label="後ろ">後ろ</button>
        <button type="button" data-label="その他">その他</button>
      </div>

      <button class="btn btn-shoot" id="shootBtn" disabled>📷 撮影する</button>

      <!-- 画面内カメラが使えないときの予備 -->
      <button class="btn btn-sub hidden" id="fallbackBtn">標準カメラで撮影する（枠なし）</button>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
    </div>

    <div class="card">
      <label class="title">保存した写真</label>
      <ul class="list" id="photoList"></ul>
      <div class="empty" id="emptyMsg">まだありません</div>
    </div>

    <button class="btn btn-sub" id="finishBtn">この顧客の撮影を終了する</button>
  </div>

  <!-- 画面3：撮影終了（アップロード完了の表示） -->
  <div id="screenDone" class="hidden">
    <div class="card">
      <div class="done-mark" id="doneMark">✅</div>
      <p class="done-title" id="doneTitle">ドライブへのアップロードが完了しました</p>
      <div class="done-info">
        顧客ID：<strong id="doneId"></strong><br>
        撮影区分：<strong id="donePhase"></strong><br>
        保存した写真：<strong id="doneCount"></strong>
      </div>
      <p class="done-warn hidden" id="doneWarn"></p>
      <button class="btn btn-primary" id="nextBtn">次の顧客を撮影する</button>
    </div>
  </div>

</div>

<script>
  // 保存する写真の、長い辺の最大サイズ（ピクセル）
  var MAX_SIDE = 2000;
  // JPEGの画質（0〜1）
  var JPEG_QUALITY = 0.85;
  // カメラ映像を画面の高さの何割まで使うか
  var STAGE_HEIGHT_RATIO = 0.6;
  // 保存の応答を待つ時間（ミリ秒）
  var SAVE_TIMEOUT = 90000;

  var currentId = '';
  var currentPhase = '';   // 'Before' または 'After'
  var currentLabel = '正面';
  var sendingCount = 0;
  var savedCount = 0;      // この顧客で保存できた枚数
  var failedCount = 0;     // この顧客で保存できなかった枚数
  var finishing = false;   // 「終了する」が押され、保存完了を待っている状態
  var stream = null;

  // ---- シャッター音（音声ファイルを使わず、その場で音を作る）----
  var audioCtx = null;
  function playShutterSound() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var now = audioCtx.currentTime;
      shutterClick(now);          // カ
      shutterClick(now + 0.09);   // シャ
    } catch (e) { /* 音が出せなくても撮影は続ける */ }
  }
  function shutterClick(startAt) {
    var length = Math.floor(audioCtx.sampleRate * 0.06);
    var buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < length; i++) {
      // 雑音を急速に小さくして「カシャ」という短い音にする
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3);
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 1200;
    var gain = audioCtx.createGain();
    gain.gain.value = 0.9;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(startAt);
  }

  // ---- 「撮影しました」の表示 ----
  var toastTimer = null;
  function showShotToast() {
    $('toast').classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('on'); }, 900);
  }

  var $ = function (id) { return document.getElementById(id); };
  var video = $('video');

  function show(screenId) {
    ['screenWait', 'screenNoBridge', 'screenId', 'screenShoot', 'screenDone'].forEach(function (s) {
      $(s).classList.toggle('hidden', s !== screenId);
    });
    window.scrollTo(0, 0);
  }

  // ---- 入口アプリ（GAS）との連絡 ----
  // 写真の保存は、このページを開いた入口アプリのタブに頼みます。
  var connected = false;
  var bridgeOrigin = '';
  var pending = {};
  var reqSeq = 0;
  var GAS_ORIGIN = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;

  window.addEventListener('message', function (ev) {
    // 入口アプリ以外からの連絡は無視する
    if (!window.opener || ev.source !== window.opener) return;
    if (!GAS_ORIGIN.test(ev.origin)) return;
    var d = ev.data || {};

    if (d.type === 'mp-hello') {
      bridgeOrigin = ev.origin;
      if (!connected) {
        connected = true;
        show('screenId');
      }
      return;
    }

    if (d.type === 'mp-result' && pending[d.reqId]) {
      var p = pending[d.reqId];
      delete pending[d.reqId];
      clearTimeout(p.timer);
      if (d.ok) {
        p.resolve(d);
      } else {
        p.reject(new Error(d.error || '保存先でエラーが起きました'));
      }
    }
  });

  function connect() {
    if (!window.opener) {
      $('bridgeDetail').textContent = '【原因の手がかり】開いた元の画面が見つかりません（opener なし）';
      show('screenNoBridge');
      return;
    }
    try {
      window.opener.postMessage({ type: 'mp-ready' }, '*');   // 写真などの中身は含まない合図だけ
    } catch (e) { /* 下のタイムアウトで案内する */ }
    setTimeout(function () {
      if (!connected) {
        $('bridgeDetail').textContent = '【原因の手がかり】入口アプリから返事がありません（応答なし）';
        show('screenNoBridge');
      }
    }, 5000);
  }

  function callSave(id, phase, label, image) {
    return new Promise(function (resolve, reject) {
      if (!window.opener || window.opener.closed || !bridgeOrigin) {
        reject(new Error('入口アプリのタブが閉じられています。このタブを閉じて、入口アプリから開き直してください'));
        return;
      }
      var reqId = String(++reqSeq);
      var timer = setTimeout(function () {
        delete pending[reqId];
        reject(new Error('保存の応答がありません。入口アプリのタブが開いているか確認してください'));
      }, SAVE_TIMEOUT);
      pending[reqId] = { resolve: resolve, reject: reject, timer: timer };
      window.opener.postMessage(
        { type: 'mp-save', reqId: reqId, customerId: id, phase: phase, label: label, image: image },
        bridgeOrigin
      );
    });
  }

  // ---- 画面1：ID入力と Before / After の選択 ----
  $('phases').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) selectPhase(btn.dataset.phase);
  });

  function selectPhase(phase) {
    currentPhase = phase;
    var buttons = $('phases').querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('on', buttons[i].dataset.phase === phase);
    }
    if (phase) $('idError').textContent = '';
  }

  $('startBtn').addEventListener('click', startShooting);
  $('customerId').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') startShooting();
  });

  function startShooting() {
    var id = $('customerId').value.trim();
    if (!id) {
      $('idError').textContent = '顧客IDを入力してください。';
      return;
    }
    if (!/^[A-Za-z0-9_-]{1,30}$/.test(id)) {
      $('idError').textContent = '顧客IDは半角英数字で入力してください。';
      return;
    }
    if (currentPhase !== 'Before' && currentPhase !== 'After') {
      $('idError').textContent = 'Before か After を選んでください。';
      return;
    }
    $('idError').textContent = '';
    currentId = id;
    $('idDisplay').textContent = id;
    $('phaseBadge').textContent = currentPhase;
    $('photoList').innerHTML = '';
    $('emptyMsg').classList.remove('hidden');
    savedCount = 0;
    failedCount = 0;
    finishing = false;
    $('finishBtn').disabled = false;
    $('finishBtn').textContent = 'この顧客の撮影を終了する';
    selectLabel('正面');
    $('customerId').blur();
    show('screenShoot');
    startCamera();
  }

  // ---- カメラの起動・停止 ----
  function startCamera() {
    $('camMsg').textContent = 'カメラを起動しています…';
    $('camMsg').classList.remove('hidden');
    $('shootBtn').disabled = true;
    $('fallbackBtn').classList.add('hidden');
    fitStage();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraFailed(null);
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },   // 背面カメラ
        width: { ideal: 3840 },
        height: { ideal: 2160 }
      }
    }).then(function (s) {
      stream = s;
      video.srcObject = s;
      return video.play();
    }).then(function () {
      $('camMsg').classList.add('hidden');
      $('shootBtn').disabled = false;
      fitStage();
    }).catch(function (err) {
      cameraFailed(err);
    });
  }

  function cameraFailed(err) {
    stopCamera();
    var detail = err ? (err.name + '：' + err.message) : 'このブラウザは画面内カメラに対応していません';
    $('camMsg').innerHTML =
      '<div>画面内カメラを起動できませんでした。<br>' +
      'カメラの使用を「許可」にしているか確認してください。<br>' +
      '下のボタンから標準カメラでも撮影できます。</div>' +
      '<div id="errDetail" style="font-size:14px;opacity:.85;margin-top:12px"></div>';
    $('errDetail').textContent = '【原因の手がかり】' + detail;
    $('camMsg').classList.remove('hidden');
    $('shootBtn').disabled = true;
    $('fallbackBtn').classList.remove('hidden');
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    video.srcObject = null;
  }

  // カメラ映像の縦横比に合わせて表示枠の大きさを決める
  function fitStage() {
    var vw = video.videoWidth || 3;
    var vh = video.videoHeight || 4;
    var ratio = vw / vh;
    var availW = $('stage').parentNode.clientWidth;
    if (!availW) return;
    var maxH = window.innerHeight * STAGE_HEIGHT_RATIO;
    var w = Math.min(availW, maxH * ratio);
    $('stage').style.width = Math.round(w) + 'px';
    $('stage').style.height = Math.round(w / ratio) + 'px';
  }
  video.addEventListener('loadedmetadata', fitStage);
  video.addEventListener('resize', fitStage);       // iPadを回転したとき
  window.addEventListener('resize', fitStage);

  // ---- 向きの選択（枠の形も切り替える）----
  $('labels').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) selectLabel(btn.dataset.label);
  });

  function selectLabel(label) {
    currentLabel = label;
    var buttons = $('labels').querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('on', buttons[i].dataset.label === label);
    }
    $('guideFront').classList.toggle('hidden', !(label === '正面' || label === '後ろ'));
    $('guideLeft').classList.toggle('hidden', label !== '左向き');
    $('guideRight').classList.toggle('hidden', label !== '右向き');
  }

  // ---- 撮影（画面内カメラ）----
  $('shootBtn').addEventListener('click', function () {
    if (!stream || !video.videoWidth || finishing) return;

    // 撮影の合図：シャッター音・画面が光る・「撮影しました」の表示
    playShutterSound();
    showShotToast();

    var w = video.videoWidth;
    var h = video.videoHeight;
    var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    var dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);

    // 撮れたことが分かるよう画面を一瞬光らせる
    $('flash').classList.add('on');
    setTimeout(function () { $('flash').classList.remove('on'); }, 60);

    upload(dataUrl, currentId, currentLabel);
  });

  // ---- 撮影（予備：標準カメラ）----
  $('fallbackBtn').addEventListener('click', function () {
    $('fileInput').click();
  });

  $('fileInput').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    var id = currentId;
    var label = currentLabel;
    shrinkImage(file).then(function (dataUrl) {
      upload(dataUrl, id, label);
    }).catch(function () {
      var row = addRow(label);
      row.st.textContent = '× 写真を読み込めませんでした。もう一度撮影してください';
      row.st.className = 'st fail';
    });
  });

  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var image = new Image();
      image.onload = function () {
        var w = image.naturalWidth;
        var h = image.naturalHeight;
        var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('load error'));
      };
      image.src = url;
    });
  }

  // ---- ドライブへ保存（入口アプリ経由）----
  function upload(dataUrl, id, label) {
    var row = addRow(label);
    row.img.src = dataUrl;
    sendingCount++;
    callSave(id, currentPhase, label, dataUrl.split(',')[1]).then(function (res) {
      row.name.textContent = res.fileName;
      row.st.textContent = '✓ 保存しました';
      row.st.className = 'st done';
      savedCount++;
    }).catch(function (err) {
      row.st.textContent = '× 保存できませんでした（' + err.message + '）';
      row.st.className = 'st fail';
      failedCount++;
    }).then(function () {
      sendingCount--;
      // 「終了する」が押されていて、全部の保存が終わったら完了画面へ
      if (finishing && sendingCount === 0) showDone();
    });
  }

  // 保存一覧に1行追加する
  function addRow(label) {
    $('emptyMsg').classList.add('hidden');
    var li = document.createElement('li');
    var img = document.createElement('img');
    var info = document.createElement('div');
    info.className = 'info';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = label;
    var st = document.createElement('div');
    st.className = 'st sending';
    st.textContent = '保存中…';
    info.appendChild(name);
    info.appendChild(st);
    li.appendChild(img);
    li.appendChild(info);
    $('photoList').insertBefore(li, $('photoList').firstChild);
    return { img: img, name: name, st: st };
  }

  // ---- 終了 ----
  $('finishBtn').addEventListener('click', function () {
    if (finishing) return;
    if (sendingCount > 0) {
      // 保存中の写真がある → 全部終わるまで待ってから完了画面を出す
      finishing = true;
      $('finishBtn').disabled = true;
      $('finishBtn').textContent = 'ドライブに保存中です… 完了までお待ちください';
      $('shootBtn').disabled = true;
      return;
    }
    showDone();
  });

  // 撮影終了後の完了画面を出す
  function showDone() {
    finishing = false;
    stopCamera();

    // 1枚も撮っていない場合は、そのままID入力に戻る
    if (savedCount === 0 && failedCount === 0) {
      backToIdScreen();
      return;
    }

    $('doneId').textContent = currentId;
    $('donePhase').textContent = currentPhase;
    $('doneCount').textContent = savedCount + '枚';

    if (failedCount === 0) {
      $('doneMark').textContent = '✅';
      $('doneTitle').textContent = 'ドライブへのアップロードが完了しました';
      $('doneTitle').classList.remove('warn');
      $('doneWarn').classList.add('hidden');
    } else {
      $('doneMark').textContent = '⚠️';
      $('doneTitle').textContent = '保存できなかった写真があります';
      $('doneTitle').classList.add('warn');
      $('doneWarn').textContent =
        failedCount + '枚がドライブに保存されていません。もう一度この顧客IDで撮影し直してください。';
      $('doneWarn').classList.remove('hidden');
    }
    show('screenDone');
  }

  function backToIdScreen() {
    currentId = '';
    selectPhase('');   // 次の顧客では Before / After を選び直してもらう
    $('customerId').value = '';
    show('screenId');
  }

  $('nextBtn').addEventListener('click', backToIdScreen);

  // ---- 人型の枠の大きさ・位置の調整（このiPadに記憶する）----
  var guide = { scale: 1, y: 0 };

  function loadGuide() {
    try {
      var s = JSON.parse(localStorage.getItem('monitorPhoto.guide') || 'null');
      if (s && s.scale > 0) {
        guide.scale = Number(s.scale) || 1;
        guide.y = Number(s.y) || 0;
      }
    } catch (e) { /* 読み込めなければ初期値のまま */ }
  }
  function saveGuide() {
    try { localStorage.setItem('monitorPhoto.guide', JSON.stringify(guide)); } catch (e) { /* 記憶できなくても今回は使える */ }
  }
  function applyGuide() {
    $('stage').style.setProperty('--gs', String(guide.scale));
    $('stage').style.setProperty('--gy', guide.y + '%');
  }

  $('adjust').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var a = btn.dataset.adj;
    if (a === 'bigger')  guide.scale = Math.min(1.8, guide.scale * 1.04);
    if (a === 'smaller') guide.scale = Math.max(0.5, guide.scale / 1.04);
    if (a === 'up')      guide.y = Math.max(-40, guide.y - 1.5);
    if (a === 'down')    guide.y = Math.min(40, guide.y + 1.5);
    if (a === 'reset')   { guide.scale = 1; guide.y = 0; }
    guide.scale = Math.round(guide.scale * 1000) / 1000;
    applyGuide();
    saveGuide();
  });

  loadGuide();
  applyGuide();

  // ---- 起動 ----
  connect();
</script>
</body>
</html>
